<style>
  :root {
    --fg: #ffffff;
    --shadow: rgba(0, 0, 0, .45);
    --scrim: rgba(0, 0, 0, .18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #111; color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: none;
  }
  body::-webkit-scrollbar { display: none; }

  .bg {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    transition: opacity 1.6s ease;
  }
  #bgFallback { background-image: var(--fallback, linear-gradient(135deg, #355c7d, #6c5b7b 50%, #c06c84)); }
  #bgImage { opacity: 0; }
  #bgImage.show { opacity: 1; }
  .scrim {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 55% at 50% 52%, var(--scrim), transparent 75%);
    transition: background 1.2s ease;
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-top: 4vh;
    transition: transform 2s ease;
  }
  #clock {
    font-family: "Baloo 2", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif;
    font-weight: 800;
    font-size: min(27vw, 54vh);
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    text-shadow: 0 .02em .06em var(--shadow), 0 0 .25em var(--shadow);
    transition: color 1.2s ease, text-shadow 1.2s ease;
    display: flex; align-items: center;
    padding-top: .06em; /* Baloo's ascender sits high; nudge optically centred */
  }
  #clock .colon {
    display: inline-block;
    margin: 0 .02em;
    transform: translateY(-.06em);
    animation: blink 2s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  #quote {
    margin-top: min(1.5vw, 3vh);
    max-width: 88vw;
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-weight: 400;
    font-size: min(2.7vw, 5vh);
    line-height: 1.4;
    letter-spacing: .06em;
    text-align: center;
    color: var(--quote-fg, var(--fg));
    text-shadow: 0 0 2px var(--quote-shadow, var(--shadow)), 0 1px 4px var(--quote-shadow, var(--shadow)), 0 0 16px var(--quote-shadow, var(--shadow));
    padding: .25em .9em;
    border-radius: 999px;
    background: radial-gradient(closest-side, var(--quote-scrim, transparent), transparent);
    transition: color 1.2s ease;
  }
  #quote .author { margin-left: .9em; opacity: .9; white-space: nowrap; }
  /* Drawn dash: CJK fonts render "——" too thin to read at a distance. */
  #quote .author::before {
    content: ""; display: inline-block; width: 1.6em; height: .09em; margin-right: .45em;
    vertical-align: .32em; border-radius: .05em;
    background: currentColor; box-shadow: 0 0 3px var(--quote-shadow, var(--shadow));
  }

  #date {
    position: fixed;
    top: max(2.2vh, env(safe-area-inset-top));
    right: max(2.4vw, env(safe-area-inset-right));
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-weight: 500;
    font-size: min(2.2vw, 4.2vh);
    line-height: 1.35;
    letter-spacing: .08em;
    text-align: right;
    color: var(--fg);
    text-shadow: 0 0 2px var(--shadow), 0 0 3px var(--shadow), 0 1px 5px var(--shadow), 0 0 16px var(--shadow);
    transition: color 1.2s ease;
    white-space: nowrap;
  }
  #date div { display: block; }

  #hint {
    position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
    font: 600 min(1.8vw, 3.4vh)/1 "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--fg); opacity: 0; transition: opacity .8s ease;
    padding: .7em 1.2em; border-radius: 999px;
    background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
  }
  #hint.show { opacity: .85; }
  #credit {
    position: fixed; left: 1.2vw; bottom: 1vh;
    font: 500 min(1vw, 1.8vh) system-ui, sans-serif;
    color: var(--fg); opacity: .35;
  }
</style>
</head>

    "1465146344425-f00d5f5c8f07", "1418065460487-3e41a6c84dc5", "1475924156734-496f6cac6ec1", "1490750967868-88aa4486c946",
    "1439853949127-fa647821eba0", "1511884642898-4c92249e20b6", "1454496522488-7a8e488e8606", "1519681393784-d120267933ba",
    "1482938289607-e9573fc25ebb", "1505765050516-f72dcac9c60e", "1494500764479-0c8f2919a3d8", "1500534314209-a25ddb2bd429",
    "1502082553048-f009c37129b9", "1431794062232-2a99a5431c6c", "1414609245224-afa02bfb3fda", "1476514525535-07fb3b4ae5f1",
    "1504893524553-b855bce32c67", "1508739773434-c26b3d09e071", "1513836279014-a89f7a76ae86", "1516214104703-d870798883c5",
    "1532274402911-5a369e4c4bb5", "1542224566-6e85f2e6772f", "1540206395-68808572332f", "1528184039930-bd03972bd974",
    "1470770841072-f978cf4d019e", "1473773508845-188df298d2d1", "1509316975850-ff9c5deb0cd9", "1497436072909-60f360e1d4b1"
  ];
  var GRADIENTS = [
    ["#355c7d", "#6c5b7b", "#c06c84"], ["#0f2027", "#203a43", "#2c5364"], ["#ff7e5f", "#feb47b", "#ffcf9f"],
    ["#134e5e", "#3f8f6b", "#71b280"], ["#41295a", "#2f0743", "#5b2a86"], ["#1e3c72", "#2a5298", "#6fa3ef"],
    ["#ee9ca7", "#f6c1c7", "#ffdde1"], ["#2c3e50", "#4ca1af", "#c4e0e5"]
  ];

  function dayNumber(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function hourSlot(d) { return dayNumber(d) * 24 + d.getHours(); }
  // 17 is coprime with the list length, so consecutive hours walk through every photo before any repeat,
  // and the same hour on consecutive days lands 8 photos apart.
  function photoIndex(slot) {
    if (params.get("img") !== null) return ((+params.get("img") % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
    return ((slot * 17) % PHOTOS.length + PHOTOS.length) % PHOTOS.length;
  }
  function photoUrl(i) {
    var w = Math.min(2560, Math.ceil(Math.max(screen.width, screen.height, innerWidth) * Math.min(devicePixelRatio || 1, 2) / 256) * 256);
    return "https://images.unsplash.com/photo-" + PHOTOS[i] + "?auto=format&fit=crop&q=80&w=" + w;
  }

  var root = document.documentElement.style;
  var $ = function (id) { return document.getElementById(id); };
  var bgImage = $("bgImage");

  function applyTheme(lum, r, g, b) {
    // Light background -> deep, slightly tinted ink; dark/mid background -> warm white.
    if (lum > 0.58) {
      var k = 0.22;
      root.setProperty("--fg", "rgb(" + Math.round(r * k) + "," + Math.round(g * k) + "," + Math.round(b * k + 10) + ")");
      root.setProperty("--shadow", "rgba(255,255,255,.55)");
      root.setProperty("--scrim", "rgba(255,255,255,.28)");
    } else {
      root.setProperty("--fg", "#fffdf7");
      root.setProperty("--shadow", lum > 0.42 ? "rgba(0,0,0,.6)" : "rgba(0,0,0,.42)");
      root.setProperty("--scrim", lum > 0.42 ? "rgba(0,0,0,.3)" : "rgba(0,0,0,.16)");
    }
  }

  // The quote sits below the clock region, so it gets its own contrast decision from the pixels right behind it, with a stronger halo.
  function applyTextTheme(prefix, c) {
    var lum = c[0];
    if (lum > 0.6) {
      root.setProperty("--" + prefix + "-fg", "rgb(" + Math.round(c[1] * .2) + "," + Math.round(c[2] * .2) + "," + Math.round(c[3] * .2 + 10) + ")");
      root.setProperty("--" + prefix + "-shadow", "rgba(255,255,255,.75)");
      root.setProperty("--" + prefix + "-scrim", "rgba(255,255,255,.35)");
    } else {
      root.setProperty("--" + prefix + "-fg", "#fffdf7");
      root.setProperty("--" + prefix + "-shadow", lum > 0.4 ? "rgba(0,0,0,.75)" : "rgba(0,0,0,.5)");
      root.setProperty("--" + prefix + "-scrim", lum > 0.4 ? "rgba(0,0,0,.3)" : "rgba(0,0,0,.18)");
    }
  }

  // Average colour of the region where the clock sits (cover-cropped like the CSS background).
  function sample(img) {
    try {
      var c = document.createElement("canvas"), W = 160, H = Math.round(160 * innerHeight / innerWidth);
      c.width = W; c.height = H;
      var ctx = c.getContext("2d");
      var s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      var avg = function (x, y, w, h) {
        var data = ctx.getImageData(Math.round(W * x), Math.round(H * y), Math.round(W * w), Math.round(H * h)).data;
        var r = 0, g = 0, b = 0, L = 0, n = data.length / 4;
        for (var i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          L += (0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2]) / 255;
        }
        return [L / n, r / n, g / n, b / n];
      };
      var c1 = avg(0.12, 0.22, 0.76, 0.6);
      applyTheme(c1[0], c1[1], c1[2], c1[3]);
      var qr = $("quote").getBoundingClientRect();
      applyTextTheme("quote", qr.width ? avg(qr.left / innerWidth, qr.top / innerHeight, qr.width / innerWidth, qr.height / innerHeight) : avg(0.15, 0.68, 0.7, 0.12));
    } catch (e) {
      applyTheme(0.5, 0, 0, 0); // canvas tainted: white text with a strong shadow is safest
      applyTextTheme("quote", [0.5, 0, 0, 0]);
    }
  }

  var currentSlot = null;
  function setBackground(d) {
    var slot = hourSlot(d);
    if (slot === currentSlot) return;
    var first = currentSlot === null;
    currentSlot = slot;
    if (first) {
      var dn = dayNumber(d), gr = GRADIENTS[((dn % GRADIENTS.length) + GRADIENTS.length) % GRADIENTS.length];
      root.setProperty("--fallback", "linear-gradient(135deg," + gr[0] + "," + gr[1] + " 55%," + gr[2] + ")");
      applyTheme(0.4, 0, 0, 0);
    }
    var idx = photoIndex(slot), url = photoUrl(idx), img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function () {
      if (slot !== currentSlot) return;
      sample(img);
      bgImage.classList.remove("show");
      setTimeout(function () {
        bgImage.style.backgroundImage = "url('" + url + "')";
        bgImage.classList.add("show");
      }, bgImage.style.backgroundImage ? 900 : 0);
      // Warm the cache with next hour's photo so the switch is instant on flaky Wi-Fi.
      var t = new Image(); t.crossOrigin = "anonymous";
      t.src = photoUrl(photoIndex(slot + 1));
    };
    // Keep the previous hour's photo if the new one can't load; the gradient only shows when nothing loaded yet.
    img.onerror = function () {};
    img.src = url;
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var timer;
  function tick() {
    var d = now();
    $("hh").textContent = pad(d.getHours());
    $("mm").textContent = pad(d.getMinutes());
    $("solar").textContent = solarString(d);
    $("weekday").textContent = weekdayString(d);
    $("lunar").textContent = lunarString(d);
    var q = quoteFor(d);
    $("quoteText").textContent = q.text;
    $("quoteAuthor").textContent = q.author;
    setBackground(d);
    // Tiny drift each minute to reduce burn-in on always-on screens.
    var m = d.getMinutes();
    $("stage").style.transform = "translate(" + ((m % 5) - 2) * 3 + "px," + ((m % 3) - 1) * 3 + "px)";
    clearTimeout(timer);
    timer = setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 30);
  }

  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { wakeLock = null; });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { tick(); if (!wakeLock) requestWakeLock(); }

  function toggleFullscreen() {
    var el = document.documentElement;
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fs) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { var p = req.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); }

    requestWakeLock();
    $("hint").classList.remove("show");
  }
  document.addEventListener("click", toggleFullscreen);
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  var hint = $("hint");
  if (!params.has("t")) {
    setTimeout(function () { hint.classList.add("show"); }, 600);
    setTimeout(function () { hint.classList.remove("show"); }, 6000);
  }

  tick();
  requestWakeLock();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tick);

    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    // A new version took over an already-open clock: reload once so the tablet shows it.
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });

      setInterval(function () { reg.update().catch(function () {}); }, 3600000);
    }).catch(function () {});
  }
})();
